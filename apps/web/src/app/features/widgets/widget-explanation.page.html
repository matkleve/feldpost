@if (entry(); as entry) {
  <div class="widget-explanation__content">
    <h1>{{ t(entry.nameKey, entry.nameFallback) }}</h1>
    <p>{{ t(entry.summaryKey, entry.summaryFallback) }}</p>
    <p>{{ t(entry.bodyKey, entry.bodyFallback) }}</p>
  </div>
} @else {
  <p>{{ t('widget.explanation.missing', 'This widget is not in the catalog.') }}</p>
}
<button type="button" (click)="back()">{{ t('widget.explanation.back', 'Back') }}</button>
